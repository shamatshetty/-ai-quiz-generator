databases:
  - name: quizpop-postgres
    databaseName: quizpop
    user: quizpop_user
    plan: free

services:
  - type: web
    name: quizpop-classroom
    env: node
    plan: free
    buildCommand: npm run deploy:setup
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: quizpop-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
